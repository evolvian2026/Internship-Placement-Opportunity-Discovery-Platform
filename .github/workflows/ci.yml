name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportunities_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opportunities_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opportunities_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      DATA_SOURCE: mock
      REDIS_URL: redis://localhost:6379
      QUEUE_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @odp/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Apply the schema to the test database
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the web app
        run: npm run build --workspace @odp/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportunities
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opportunities?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      DATA_SOURCE: mock
      # The E2E run drives the UI; background ingestion would add noise.
      INGESTION_ENABLED: 'false'
      REDIS_URL: redis://localhost:6379
      QUEUE_ENABLED: 'false'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package and generate the Prisma client
        run: |
          npm run build --workspace @odp/shared
          npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Prepare the database
        run: |
          npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate
          npm run db:seed --workspace @odp/api
          npm run ingest --workspace @odp/api

      - name: Build the web app
        run: npm run build --workspace @odp/web

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start the API and the web app
        run: |
          npm run start --workspace @odp/api &
          npm run start --workspace @odp/web &
          npx wait-on http://localhost:4000/health http://localhost:3000 --timeout 90000

      - name: Run the end-to-end suite
        run: npx playwright test
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
